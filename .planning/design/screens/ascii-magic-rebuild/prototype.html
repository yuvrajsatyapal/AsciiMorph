<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AsciiMorph — design-only Studio prototype</title><link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet"><link rel="stylesheet" href="prototype.css"></head>
<body>
<header class="navbar">
 <button class="brand" data-action="about">AsciiMorph</button><div class="workspace" role="group" aria-label="Workspace"><button class="on" data-workspace="studio" aria-pressed="true">Studio</button><button data-workspace="flow" aria-pressed="false">Flow</button></div>
 <div class="tools"><button data-action="zoom-out" aria-label="Zoom out" data-icon="search"></button><button id="zoom" data-action="fit">100%</button><button data-action="zoom-in" aria-label="Zoom in" data-icon="plus"></button><span class="separator"></span><button data-action="crop" aria-label="Crop image" data-icon="crop"></button><button data-action="compare" aria-label="Compare original" aria-pressed="false" data-icon="compare"></button><span class="separator"></span><button data-action="text" aria-label="Add text" data-icon="text"></button><span class="separator"></span><button data-action="undo" aria-label="Undo" data-icon="undo"></button><button data-action="redo" aria-label="Redo" data-icon="redo"></button><span class="separator"></span><button data-action="layers" aria-label="Layers" data-icon="layers"></button></div>
 <div class="account-tools"><button class="pro" data-service="Plans are not configured for this prototype.">Go Pro</button><button data-action="help">Help</button><button data-service="Authentication is not configured for this prototype.">Sign in</button><button class="icon" data-action="menu" aria-label="Open menu" data-icon="menu"></button></div>
</header>
<aside class="catalog" id="catalog" aria-label="Style catalog"><div class="catalog-head"><span>Styles</span><div><button class="icon" data-action="expand-catalog" aria-label="Expand style catalog" data-icon="expand"></button><button class="icon" data-action="collapse-catalog" aria-label="Collapse style catalog" data-icon="collapse"></button></div></div><div class="catalog-body"><div class="segment"><button class="on" data-mode="realtime" aria-pressed="true">Realtime</button><button data-mode="generative" aria-pressed="false">Generative</button></div><label class="search"><img src="assets/search.svg" alt=""><input type="search" id="search" placeholder="Search name or tag" aria-label="Search styles"></label><div class="tabs" role="group" aria-label="Style collections"><button class="on" data-tab="explore" aria-pressed="true">Explore</button><button data-tab="favorites" aria-pressed="false">Favorites</button><button data-tab="recipes" aria-pressed="false">Recipes</button></div><div id="catalog-content"></div></div><div class="mini-catalog"><button data-action="collapse-catalog" aria-label="Open style catalog" data-icon="expand"></button><button data-action="open-style-sheet">Aa</button><button data-style="dither">Di</button><button data-style="pixelart">Px</button></div></aside>
<main class="stage" id="stage"><section class="studio-view" aria-label="Image preview"><div class="source-frame" id="source-frame"><canvas id="preview" width="1000" height="1000" aria-label="Original procedural botanical demonstration"></canvas><span id="text-overlay"></span></div><div class="empty-source" hidden><p>Add an image to begin</p><button data-action="upload">Upload image</button></div><div class="stage-status" id="stage-status" role="status" aria-live="polite"></div><span class="compare-label" hidden>Original</span></section><section class="flow-view" hidden aria-label="Flow graph"><div class="flow-lines"><i></i><i></i></div><article class="flow-node source-node"><header>Source <select aria-label="Source type"><option>Image</option></select></header><img class="node-source" src="assets/botanical.svg?v=20261020-bright" alt="Original botanical source"><div class="node-body">Options<button data-action="upload" class="node-file">botanical.svg <span>Change</span></button></div></article><article class="flow-node style-node"><header>Style <select id="flow-style" aria-label="Flow style"></select></header><div class="node-body"><p>Options</p><div class="node-tabs">Characters　 Depth　 Intensity　 Animation</div><div id="flow-controls"></div></div></article><article class="flow-node output-node"><header>Output</header><canvas id="flow-preview" width="1000" height="1000" aria-label="Flow demonstration output"></canvas><footer>1:1 <span>1000 × 1000</span></footer></article></section>
<div class="actionbar studio-actions"><button data-action="upload" data-icon="upload">Upload</button><button data-action="inspire" data-icon="inspire">Inspire</button><button data-action="restyle" data-icon="restyle">Restyle</button><button data-action="shuffle" data-icon="shuffle">Shuffle</button><button data-action="library" data-icon="library">Library</button><button class="export-button" data-action="export" data-icon="export">Export</button></div><div class="actionbar flow-actions" hidden><button data-action="add-node">Add node</button><button data-action="fit">Fit content</button><button class="export-button" data-action="export" data-icon="export">Export</button></div></main>
<aside class="property-dock" aria-label="Style controls"><nav class="property-rail" aria-label="Property categories"><button class="on" data-panel="characters" aria-label="Characters" aria-pressed="true">Aa</button><button data-panel="depth" aria-label="Depth" data-icon="layers" aria-pressed="false"></button><button data-panel="animation" aria-label="Animation" data-icon="play" aria-pressed="false"></button><button data-panel="lights" aria-label="Lights" data-icon="lights" aria-pressed="false"></button><button data-panel="color" aria-label="Color" data-icon="color" aria-pressed="false"></button><button data-panel="post" aria-label="Post effects" data-icon="inspire" aria-pressed="false"></button><button data-panel="mask" aria-label="Mask" data-icon="mask" aria-pressed="false"></button></nav><div class="property-content" id="properties"></div></aside>
<div class="mobile-tabs"><button data-action="open-style-sheet">Styles</button><button data-action="open-control-sheet">Controls</button></div>
<div id="export-popover" class="popover export-popover" hidden><div class="popover-title">Export image<button class="icon" data-action="close-popovers" aria-label="Close export" data-icon="close"></button></div><p class="muted">Design preview · local demonstration</p><label>Format<select id="export-format"><option value="png">PNG</option><option value="jpeg">JPEG</option></select></label><label>Resolution<select id="export-scale"><option value="1">1× · 1000 × 1000</option><option value="2">2× · 2000 × 2000</option></select></label><label class="check-row"><input type="checkbox" id="export-transparent">Transparent background (PNG)</label><button class="primary" data-action="download">Download preview</button><button class="plain" data-service="Video/GIF export requires the production Rust and media pipeline. This design prototype exports still previews only.">Video / GIF options</button></div>
<div id="menu-popover" class="popover menu-popover" hidden><button data-action="clear">Clear source</button><button data-action="state-loading">Preview loading state</button><button data-action="state-error">Preview error state</button><button data-service="The existing character editor will remain at the compatibility route. This standalone design prototype does not navigate production data.">Open legacy character editor</button><button data-action="about">About this prototype</button></div>
<dialog id="dialog"><form method="dialog"><div class="dialog-head"><h2 id="dialog-title">AsciiMorph</h2><button class="icon" aria-label="Close dialog" data-icon="close"></button></div><div id="dialog-body"></div><button class="primary">Close</button></form></dialog><input type="file" id="file-input" accept="image/*" hidden><script src="prototype.js"></script></body></html>
